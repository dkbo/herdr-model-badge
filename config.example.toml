# Sidebar rows for herdr-model-badge — copy into ~/.config/herdr/config.toml,
# then run `herdr server reload-config`.
#
# The plugin reports its values as pane metadata tokens; herdr decides where they
# go and how they look. Nothing appears until a row references a `$token`.
#
# Two things shape every layout below:
#
#   * herdr joins the tokens in a row with " · ", so you get separators for free
#     and should not bake them into a value.
#   * herdr styles a token as a whole. That is why each value is reported both
#     whole and pre-split: spend one token on "5h:6% (→04:29)", or two on a
#     coloured percentage and a quiet reset time.
#
# Give each agent only the rows it can fill: a row whose tokens are all empty is
# still a row. Antigravity has no usage windows, and a Claude account billed
# through the API or console reports no rate limits either. `$cost` is Claude's
# alone — no other agent records what a session cost, only how many tokens it used.
#
# The `$usage*` values expire: herdr drops them once the window they describe has
# reset, or after 30 minutes with nothing to confirm them. The rows above then go
# blank on a pane nobody is using, while the model beside them stays.
#
# Colours below follow what a Claude Code statusline does: every percentage in one
# green, the model bold, and the labels and reset times quiet but not invisible.
#
# An inline style takes a strict #RGB/#RRGGBB `fg` plus `bold` and `dim`. Every
# token here says `dim = false` rather than leaving `dim` out: an omitted field
# keeps herdr's contextual style, which can pull a colour back down on a row that
# is not focused, and an explicit `false` removes that modifier for good. Greys do
# the quietening instead, which stays legible on a dark background where dim does
# not.

[ui.sidebar.agents.rows_by_agent]

#   ○ herdrp
#       claude
#       opus 5 · high · 21%          bold model, readable effort, green context
#       5h:6% · →02:10               green number, quiet reset
#       wk:4% · →09-14
#       $1.23                        what this session has cost so far
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#9399b2", dim = false }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true, dim = false },
    { token = "$effort", fg = "#bac2de", dim = false },
    { token = "$ctx", fg = "#a6e3a1", dim = false },
  ],
  [{ token = "$usage_session_pct", fg = "#a6e3a1", dim = false }, { token = "$usage_session_at", fg = "#a6adc8", dim = false }],
  [{ token = "$usage_period_pct", fg = "#a6e3a1", dim = false }, { token = "$usage_period_at", fg = "#a6adc8", dim = false }],
  [{ token = "$cost", fg = "#5fe1d6", dim = false }],
]

#   ○ my-service
#       codex
#       gpt 5.5 · medium · 17k
#       30d:0% · →10-05
codex = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#9399b2", dim = false }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true, dim = false },
    { token = "$effort", fg = "#bac2de", dim = false },
    { token = "$ctx", fg = "#a6e3a1", dim = false },
  ],
  [{ token = "$usage_session_pct", fg = "#a6e3a1", dim = false }, { token = "$usage_session_at", fg = "#a6adc8", dim = false }],
  [{ token = "$usage_period_pct", fg = "#a6e3a1", dim = false }, { token = "$usage_period_at", fg = "#a6adc8", dim = false }],
]

# Antigravity exposes no usage windows, so its rows stop at the model.
agy = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#9399b2", dim = false }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true, dim = false },
    { token = "$effort", fg = "#bac2de", dim = false },
    { token = "$ctx", fg = "#a6e3a1", dim = false },
  ],
]

# --- colour by value (herdr 0.9.0+) ----------------------------------------

# `rules` restyle a token by its own value. A `gt` rule only matches a value that
# parses completely as a number, so `5h:87%` never trips a threshold — style
# `$usage_*_num` and `$ctx_num`, which are the same readings with the unit taken
# off, and take the window label as its own token. The cost is the unit itself:
# herdr's " · " separator is not configurable, so the row reads `5h · 87 · →17:20`.
#
# herdr 0.8.x rejects the whole agent entry rather than ignoring `rules`
# ("keeping current ui settings"), so paste this only once you are on 0.9.0.
#
#   ○ herdrp
#       claude
#       opus 5 · high · 92          92 red and bold, 74 yellow, 21 green
#       5h · 87 · →17:20
#       wk · 41 · →09-14
#       $7.46
# claude = [
#   ["state_icon", "workspace", "tab"],
#   [{ token = "agent", fg = "#9399b2", dim = false }],
#   [
#     { token = "$model", fg = "#cdd6f4", bold = true, dim = false },
#     { token = "$effort", fg = "#bac2de", dim = false },
#     { token = "$ctx_num", fg = "#a6e3a1", dim = false, rules = [
#       { gt = 80, fg = "#ff6188", bold = true },
#       { gt = 70, fg = "#ffd75f" },
#     ] },
#   ],
#   [
#     { token = "$usage_session_label", fg = "#a6adc8", dim = false },
#     { token = "$usage_session_num", fg = "#a6e3a1", dim = false, rules = [
#       { gt = 80, fg = "#ff6188", bold = true },
#       { gt = 70, fg = "#ffd75f" },
#     ] },
#     { token = "$usage_session_at", fg = "#a6adc8", dim = false },
#   ],
#   [
#     { token = "$usage_period_label", fg = "#a6adc8", dim = false },
#     { token = "$usage_period_num", fg = "#a6e3a1", dim = false, rules = [
#       { gt = 80, fg = "#ff6188", bold = true },
#       { gt = 70, fg = "#ffd75f" },
#     ] },
#     { token = "$usage_period_at", fg = "#a6adc8", dim = false },
#   ],
#   [{ token = "$cost", fg = "#5fe1d6", dim = false }],
# ]
#
# `$ctx_num` is Claude's alone: Codex reports a context count, and a threshold
# meant for a percentage would paint `84k` as though it were one. Give Codex the
# same usage rows but keep `$ctx` on its model row.
#
# Thresholds are 70 and 80 above. A Claude Code statusline conventionally warns at
# 70 and goes red at 90; `{ gt = 90 }` matches that instead. `gt` is strictly
# greater, so `gt = 80` first turns red at 81.

