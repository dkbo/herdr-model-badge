# Sidebar rows for herdr-model-badge — copy into ~/.config/herdr/config.toml,
# then run `herdr server reload-config`.
#
# The plugin reports its values as pane metadata tokens; herdr decides where they
# go and how they look. Nothing appears until a row references a `$token`.
#
# Two things shape every layout below:
#
#   * herdr joins the tokens in a row with " · ", so you get separators for free
#     and should not bake them into a value.
#   * herdr styles a token as a whole. That is why each value is reported both
#     whole and pre-split: spend one token on "5h:6% (→04:29)", or two on a
#     coloured percentage and a quiet reset time.
#
# Give each agent only the rows it can fill: a row whose tokens are all empty is
# still a row. Antigravity has no usage windows, and a Claude account billed
# through the API or console reports no rate limits either.
#
# Colours below are Catppuccin Mocha, which matches herdr's default theme. An
# inline style takes a strict #RGB/#RRGGBB `fg` plus `bold` and `dim`; omitted
# fields keep herdr's contextual default, so a row stays readable when selected.

[ui.sidebar.agents.rows_by_agent]

#   ○ herdrp
#       claude
#       opus 5 · high · 21%          bold model, quiet effort, blue context
#       5h:6% · →02:10               green number, quiet reset
#       wk:4% · →09-14
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", dim = true }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true },
    { token = "$effort", dim = true },
    { token = "$ctx", fg = "#89b4fa" },
  ],
  [{ token = "$usage_session_pct", fg = "#a6e3a1" }, { token = "$usage_session_at", dim = true }],
  [{ token = "$usage_period_pct", fg = "#a6e3a1" }, { token = "$usage_period_at", dim = true }],
]

#   ○ my-service
#       codex
#       gpt 5.5 · medium · 17k
#       30d:0% · →10-05
codex = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", dim = true }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true },
    { token = "$effort", dim = true },
    { token = "$ctx", fg = "#89b4fa" },
  ],
  [{ token = "$usage_session_pct", fg = "#a6e3a1" }, { token = "$usage_session_at", dim = true }],
  [{ token = "$usage_period_pct", fg = "#a6e3a1" }, { token = "$usage_period_at", dim = true }],
]

# Antigravity exposes no usage windows, so its rows stop at the model.
agy = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", dim = true }],
  [
    { token = "$model", fg = "#cdd6f4", bold = true },
    { token = "$effort", dim = true },
    { token = "$ctx", fg = "#89b4fa" },
  ],
]

