# Sidebar rows for herdr-model-badge — copy into ~/.config/herdr/config.toml,
# then run `herdr server reload-config`.
#
# The plugin reports its values as pane metadata tokens; herdr decides where they
# go. Nothing appears until one of these rows references a `$token`.
#
# Give each agent only the rows it can fill: a row whose tokens are all empty is
# still a row. Antigravity has no usage windows, and a Claude account billed
# through the API or console reports no rate limits either — drop the two usage
# rows for those.

[ui.sidebar.agents.rows_by_agent]

#   ○ herdrp
#       claude
#       opus 5 · high  21%
#       5h:6% (→02:10)
#       wk:4% (→09-14)
claude = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [{ token = "$badge", dim = true }, { token = "$ctx", dim = true }],
  [{ token = "$usage_session", dim = true }],
  [{ token = "$usage_period", dim = true }],
]

#   ○ my-service
#       codex
#       gpt 5.5 · medium  17k
#       30d:0% (→10-05)
codex = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [{ token = "$badge", dim = true }, { token = "$ctx", dim = true }],
  [{ token = "$usage_session", dim = true }],
  [{ token = "$usage_period", dim = true }],
]

# Antigravity exposes no usage windows, so its rows stop at the badge.
agy = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [{ token = "$badge", dim = true }, { token = "$ctx", dim = true }],
]

